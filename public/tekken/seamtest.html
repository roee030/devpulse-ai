<!DOCTYPE html><html><head><meta charset="utf-8"><title>seam test</title><style>body{margin:0;background:#101018}canvas{display:block}</style></head><body>
<canvas id="c" width="900" height="600"></canvas>
<script src="js/data.js"></script><script src="js/render.js"></script><script src="js/sprites.js"></script><script src="js/rig.js"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{willReadFrequently:true});
Sprites.load(); Rig.load();
// poses that stress every joint
function poses(){
  const list={};
  list.idle=P.idle; list.crouch=P.crouch; list.jump=P.jump; list.block=P.block; list.hit=P.hit; list.down=P.down; list.win=P.win;
  list.punch=mergePose(P.idle,P.straight.hit); list.punchWind=mergePose(P.idle,P.straight.wind);
  list.kick=mergePose(P.idle,P.rkick.hit); list.kickWind=mergePose(P.idle,P.rkick.wind);
  list.upper=mergePose(P.idle,P.upper.hit); list.sweep=mergePose(P.crouch,P.sweep.hit);
  list.hkick=mergePose(P.idle,P.hkick.hit); list.axe=mergePose(P.idle,P.axe.hit); list.knee=mergePose(P.idle,P.knee.hit);
  list.walk1=mergePose(P.idle,{lF:[46,-34],lB:[-30,12],aF:[42,110],aB:[63,96]});
  list.walk2=mergePose(P.idle,{lF:[-30,12],lB:[46,-34],aF:[78,90],aB:[27,120]});
  // extreme joint bends
  list.armFold=mergePose(P.idle,{aF:[20,150],aB:[110,140]});
  list.armBack=mergePose(P.idle,{aF:[-60,40],aB:[-80,60]});
  list.legFold=mergePose(P.idle,{lF:[80,-150],lB:[70,-140],hy:40});
  list.legHigh=mergePose(P.idle,{lF:[150,-20],lB:[-20,10]});
  list.twist=mergePose(P.idle,{tor:35,head:-25});
  list.twist2=mergePose(P.idle,{tor:-30,head:25});
  return list;
}
// each character's own rest angles - the pose in which the parts reassemble into the original artwork
function restPose(ch){
  const p = Rig.data[ch.id].parts;
  const rel = (a,b)=>[p[a].ang, p[b].ang - p[a].ang];
  return { hy:0, tor: p.torso.ang - 180, head: p.head.ang - p.torso.ang + 180,
           aF: rel('uArmF','fArmF'), aB: rel('uArmB','fArmB'), lF: rel('thighF','shinF'), lB: rel('thighB','shinB') };
}
window.__run = function(){
  const PS=poses(), names=Object.keys(PS), res={};
  const JN=['elF','elB','knF','knB','shF','shB','hipF','hipB','neck'];
  // every id present in rig.json, so a freshly added fighter is measured too
  const ids = Object.keys(Rig.data);
  for(const id of ids){
    const ch = CHAR_BY_ID[id] || { id, style: Object.keys(STYLES)[0], colors:{accent:'#ffffff'}, body:{h:1,w:1,kind:'human'} };
    const per={}, bone={}, whole={}; let worst=1, worstAt='';
    const BONES=[['shF','elF'],['elF','wrF'],['shB','elB'],['elB','wrB'],['hipF','knF'],['knF','anF'],['hipB','knB'],['knB','anB'],['hip','neck']];
    const measure=(pose)=>{
      ctx.clearRect(0,0,900,600);
      const info=drawRig(ctx,ch,pose,450,520,1,1.5,{});
      if(!info) return null;
      const img=ctx.getImageData(0,0,900,600).data, cov={};
      // does the artwork actually sit on the skeleton? sample along every bone
      let bTot=0,bOn=0;
      for(const [a,b] of BONES){
        const A=info.joints[a], B=info.joints[b];
        for(let s2=0.12;s2<=0.88;s2+=0.04){
          const X=Math.round(A.x+(B.x-A.x)*s2), Y=Math.round(A.y+(B.y-A.y)*s2);
          if(X<0||Y<0||X>=900||Y>=600) continue;
          bTot++; if(img[(Y*900+X)*4+3]>24) bOn++;
        }
      }
      cov.__bone = bTot? bOn/bTot : 1;
      // wholeness: is the drawn fighter one connected piece, or did parts float away?
      {
        const W=900,H=600, st=new Int32Array(W*H); let total=0;
        const on=new Uint8Array(W*H);
        for(let i=0;i<W*H;i++){ if(img[i*4+3]>24){on[i]=1;total++;} }
        const seen=new Uint8Array(W*H); let best=0;
        for(let i=0;i<W*H;i++){
          if(!on[i]||seen[i]) continue;
          let sp=0, cnt=0; st[sp++]=i; seen[i]=1;
          while(sp){ const p=st[--sp]; cnt++;
            const px=p%W, py=(p/W)|0;
            for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
              const nx=px+dx, ny=py+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue;
              const q=ny*W+nx; if(on[q]&&!seen[q]){seen[q]=1;st[sp++]=q;}
            }
          }
          if(cnt>best) best=cnt;
        }
        cov.__whole = total? best/total : 1;
      }
      for(const j of JN){
        const p=info.joints[j], r=Math.max(6, 13*info.scale);
        let tot=0,on=0;
        for(let dy=-r;dy<=r;dy+=1) for(let dx=-r;dx<=r;dx+=1){
          if(dx*dx+dy*dy>r*r) continue;
          const X=Math.round(p.x+dx), Y=Math.round(p.y+dy);
          if(X<0||Y<0||X>=900||Y>=600) continue;
          tot++; if(img[(Y*900+X)*4+3]>24) on++;
        }
        cov[j]= tot? on/tot : 1;
      }
      return cov;
    };
    const base = measure(restPose(ch));
    if(!base){ res[id]={err:'no rig'}; continue; }
    for(const n of names){
      const cov = measure(PS[n]);
      bone[n] = +cov.__bone.toFixed(3); whole[n] = +cov.__whole.toFixed(3);
      let minCov=1, minJ='';
      for(const j of JN){
        const ratio = base[j] > 0.02 ? Math.min(1, cov[j]/base[j]) : 1;
        if(ratio<minCov){minCov=ratio;minJ=j;}
      }
      per[n]=+minCov.toFixed(3);
      if(minCov<worst){worst=minCov;worstAt=n+':'+minJ;}
    }
    const bvals=Object.values(bone);
    res[id]={worst:+worst.toFixed(3), at:worstAt, per,
      bone:+(bvals.reduce((a,b)=>a+b,0)/bvals.length).toFixed(3),
      whole:+Math.min(...Object.values(whole)).toFixed(3),
      wholeAt:Object.keys(whole).reduce((a,b)=>whole[a]<whole[b]?a:b),
      boneMin:+Math.min(...bvals).toFixed(3),
      boneAt:Object.keys(bone).reduce((a,b)=>bone[a]<bone[b]?a:b)};
  }
  return res;
};
window.__ready = () => Rig.ready() && Sprites.ready();
</script></body></html>
